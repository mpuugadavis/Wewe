name: Phase 4C verification

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: wewe_test
          POSTGRES_USER: wewe
          POSTGRES_PASSWORD: wewe_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U wewe -d wewe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20



    defaults:
      run:
        working-directory: backend

    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://wewe:wewe_test_password@localhost:5432/wewe_test
      SECRET_KEY: test-only-secret-key-not-for-any-deployment-000000
      PAYMENT_WEBHOOK_SECRET: test-webhook-secret-key-not-for-deployment
      PAYMENT_MODE: DISABLED
      RATE_LIMIT_STORAGE_URI: redis://localhost:6379/0
      RUN_POSTGRES_CONCURRENCY: "1"
      STORAGE_INTEGRATION: "1"
      STORAGE_PROVIDER: S3
      STORAGE_BUCKET: wewe-test-media
      STORAGE_ENDPOINT: http://localhost:9000
      STORAGE_PUBLIC_BASE_URL: http://localhost:9000/wewe-test-media
      STORAGE_ACCESS_KEY: wewe-test
      STORAGE_SECRET_KEY: wewe-test-storage-password

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Apply migrations
        run: alembic upgrade head

      - name: Run complete backend test suite
        run: pytest

      - name: Verify S3-compatible media storage
        run: |
          set -euo pipefail
          docker run -d --rm --name wewe-minio \
            -p 9000:9000 -p 9001:9001 \
            -e MINIO_ROOT_USER=wewe-test \
            -e MINIO_ROOT_PASSWORD=wewe-test-storage-password \
            minio/minio:latest server /data --console-address ":9001"
          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:9000/minio/health/live"
          deadline = time.time() + 60
          while time.time() < deadline:
              try:
                  with urllib.request.urlopen(url, timeout=3) as response:
                      if response.status == 200:
                          break
              except Exception:
                  pass
              time.sleep(2)
          else:
              raise SystemExit("MinIO did not become healthy within 60 seconds")
          PY
          pytest tests/test_media_storage_integration.py
          docker stop wewe-minio

      - name: Verify PostgreSQL backup and restore
        env:
          PGPASSWORD: wewe_test_password
        run: |
          set -euo pipefail
          chmod +x scripts/backup_database.sh scripts/restore_database.sh
          psql "postgresql://wewe:wewe_test_password@localhost:5432/wewe_test" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE TABLE IF NOT EXISTS backup_restore_sentinel (id integer PRIMARY KEY, marker text NOT NULL);"
          psql "postgresql://wewe:wewe_test_password@localhost:5432/wewe_test" \
            -v ON_ERROR_STOP=1 \
            -c "INSERT INTO backup_restore_sentinel(id, marker) VALUES (1, 'phase-4c-backup-ok') ON CONFLICT (id) DO UPDATE SET marker = EXCLUDED.marker;"
          export DATABASE_URL="postgresql://wewe:wewe_test_password@localhost:5432/wewe_test"
          ./scripts/backup_database.sh /tmp/wewe-backup.dump
          psql "postgresql://wewe:wewe_test_password@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE wewe_restore_test OWNER wewe;"
          export RESTORE_DATABASE_URL="postgresql://wewe:wewe_test_password@localhost:5432/wewe_restore_test"
          export RESTORE_CONFIRM=YES
          ./scripts/restore_database.sh /tmp/wewe-backup.dump
          psql "$RESTORE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT 1 FROM backup_restore_sentinel WHERE id = 1 AND marker = 'phase-4c-backup-ok';"
          psql "$RESTORE_DATABASE_URL" \
            -v ON_ERROR_STOP=1 \
            -c "SELECT version_num FROM alembic_version;"
          psql "postgresql://wewe:wewe_test_password@localhost:5432/postgres" \
            -v ON_ERROR_STOP=1 \
            -c "DROP DATABASE wewe_restore_test;"
