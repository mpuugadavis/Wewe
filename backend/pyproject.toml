[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "wewe-api"
version = "0.1.0"
description = "Marketplace, ordering, and campus delivery API for WEWE"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0",
  "uvicorn[standard]>=0.30,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "alembic>=1.13,<2.0",
  "pydantic-settings>=2.4,<3.0",
  "email-validator>=2.2,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "PyJWT[crypto]>=2.9,<3.0",
  "psycopg[binary]>=3.2,<4.0",
  "slowapi>=0.1.9,<1.0",
  "redis>=5.0,<8.0",
  "python-multipart>=0.0.9,<1.0",
]

[project.optional-dependencies]
test = ["pytest>=8.3,<9.0", "httpx>=0.27,<1.0", "pytest-cov>=5.0,<7.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = ["postgres: PostgreSQL-specific concurrency verification"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
