services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB in backend/.env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in backend/.env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in backend/.env}
    volumes:
      - wewe_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  minio:
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    environment:
      MINIO_ROOT_USER: wewe-local
      MINIO_ROOT_PASSWORD: wewe-local-storage-password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - wewe_minio:/data
    command: ["server", "/data", "--console-address", ":9001"]

  minio-init:
    image: pgsty/mc:RELEASE.2026-09-16T00-00-00Z
    depends_on:
      minio:
        condition: service_started
    environment:
      MINIO_ROOT_USER: wewe-local
      MINIO_ROOT_PASSWORD: wewe-local-storage-password
      STORAGE_BUCKET: wewe-media
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        until mc alias set local http://minio:9000 "wewe-local" "wewe-local-storage-password"; do sleep 2; done
        mc mb --ignore-existing "local/wewe-media"
        mc anonymous set download "local/wewe-media"

  media-cleanup-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to use host postgres}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-S3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-wewe-media}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/wewe-media}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-wewe-local}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-wewe-local-storage-password}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.media_cleanup_worker"]
    restart: unless-stopped

  migrate:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to use host postgres}
    depends_on:
      postgres:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]

  notification-worker:
    build: .
    env_file: .env
    environment:
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to use host postgres}
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.notification_worker"]
    restart: unless-stopped

  api:
    build: .
    env_file: .env
    environment:
      MAX_REQUEST_BODY_BYTES: ${MAX_REQUEST_BODY_BYTES:-6291456}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL to use host postgres}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-S3}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-wewe-media}
      STORAGE_ENDPOINT: ${STORAGE_ENDPOINT:-http://minio:9000}
      STORAGE_PUBLIC_BASE_URL: ${STORAGE_PUBLIC_BASE_URL:-http://localhost:9000/wewe-media}
      STORAGE_ACCESS_KEY: ${STORAGE_ACCESS_KEY:-wewe-local}
      STORAGE_SECRET_KEY: ${STORAGE_SECRET_KEY:-wewe-local-storage-password}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/live', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 15s
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]

volumes:
  wewe_postgres:
  wewe_minio:
