services:
  migrate:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    command: ["alembic", "upgrade", "head"]
    restart: "no"

  api:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    command:
      [
        "uvicorn",
        "app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers"
      ]
    ports:
      - "8000:8000"
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  notification-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.notification_worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s

  media-cleanup-worker:
    build:
      context: .
      dockerfile: Dockerfile
    env_file:
      - .env.production
    depends_on:
      migrate:
        condition: service_completed_successfully
    command: ["python", "-m", "app.workers.media_cleanup_worker"]
    restart: unless-stopped
    init: true
    stop_grace_period: 30s
